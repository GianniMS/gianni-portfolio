<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black square with the command bar's rim, lit along the top; FaviconGleam animates the light
       round the edge once the site has loaded -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffefc" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#fffefc" />
      <stop offset="1" stop-color="#fffefc" stop-opacity="0.16" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#000000" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#fffefc" stroke-opacity="0.16" stroke-width="1.5" />
  <path d="M7 0.75 H25" stroke="url(#rim)" stroke-width="1.5" />
</svg>
